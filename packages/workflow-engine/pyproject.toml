[project]
name = "workflow-engine"
version = "0.1.0"
description = "LangChain-based AI workflow engine with persistence and a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "boto3>=1.35",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "numpy>=2.0",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
    "streamlit>=1.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_engine"]
