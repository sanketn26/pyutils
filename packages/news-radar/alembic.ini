# Alembic config for news-radar. Run from packages/news-radar:
#   uv run alembic upgrade head
# The database URL is taken from NEWS_RADAR_DSN (see env.py); the value below is
# only the fallback and matches docker-compose.yml.

[alembic]
script_location = alembic
sqlalchemy.url = postgresql://news_radar:news_radar@localhost:5432/news_radar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
