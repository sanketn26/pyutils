services:
  postgres:
    image: postgres:17
    container_name: news-radar-postgres
    environment:
      POSTGRES_USER: news_radar
      POSTGRES_PASSWORD: news_radar
      POSTGRES_DB: news_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_radar -d news_radar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
